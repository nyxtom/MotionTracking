[project]
name = "dive-atlas"
version = "0.1.0"
description = "Global dive site atlas — PostGIS knowledge graph of reefs, caves, cenotes, wrecks, atolls, and regions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Thomas Holloway" }]
dependencies = [
  "sqlalchemy>=2.0.36",
  "geoalchemy2>=0.15.2",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "httpx>=0.28.0",
  "python-slugify>=8.0.4",
  "shapely>=2.0.6",
  "matplotlib>=3.9.0",
  "pillow>=10.0.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[project.scripts]
dive-atlas = "dive_atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dive_atlas"]

[tool.hatch.build.targets.wheel.sources]
"src/dive_atlas" = "dive_atlas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
